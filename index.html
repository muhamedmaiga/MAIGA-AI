<!DOCTYPE html><!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAIGA-AI</title>
<style>
body{background:#000;color:#fff;font-family:Arial;text-align:center;padding:20px;margin:0}
h1{font-size:32px;margin-top:40px}
p{font-size:18px;padding:0 10px}
input{width:90%;max-width:400px;padding:14px;font-size:16px;border-radius:10px;border:none;margin-top:20px}
button{background:yellow;color:black;border:none;padding:14px 30px;font-size:18px;border-radius:10px;margin-top:15px;font-weight:bold}
#reponse{margin-top:25px;font-size:18px;background:#222;padding:15px;border-radius:10px;min-height:50px}
</style>
</head>
<body>
<h1>🤖 MAIGA-AI</h1>
<p>Bonjour, je suis MAIGA-AI. Pose-moi une question !</p>
<input id="q" placeholder="Écris ici...">
<br>
<button onclick="parler()">Parler</button>
<div id="reponse"></div>
<script>
function parler(){
let q=document.getElementById('q').value.toLowerCase();
let r="Je suis MAIGA-AI, créé par Mohamed Maiga à Bamako ! Pose-moi une autre question.";
if(q.includes("bonjour")||q.includes("salut")) r="Bonjour ! Comment tu vas ? Moi c'est MAIGA-AI.";
if(q.includes("ton nom")||q.includes("t'appelles")) r="Je m'appelle MAIGA-AI, créé par Mohamed Maiga.";
if(q.includes("bamako")||q.includes("mali")) r="Bamako c'est la capitale du Mali, et c'est là que Mohamed m'a créé !";
if(q.includes("merci")) r="De rien, avec plaisir !";
if(q.includes("au revoir")) r="Au revoir, à très vite !";
document.getElementById('reponse').innerText=r;
}
</script>
</body>
</html>
